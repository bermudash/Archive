<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ARCHIVE</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0b0b;
      color: #d8d8d8;
      font-family: monospace;
    }

    .container {
      width: 90%;
      max-width: 600px;
      text-align: center;
    }

    .message {
      font-size: 18px;
      line-height: 1.8;
    }

    .clickable {
      color: #aaa;
      cursor: pointer;
      text-decoration: underline;
    }

    .clickable:hover {
      color: white;
    }

    #codeBox {
      display: none;
      margin-top: 30px;
    }

    input {
      width: 220px;
      padding: 12px;
      background: #111;
      border: 1px solid #555;
      color: white;
      font-family: monospace;
      text-align: center;
      outline: none;
    }

    button {
      margin-top: 12px;
      padding: 10px 25px;
      background: transparent;
      border: 1px solid #555;
      color: #ddd;
      font-family: monospace;
      cursor: pointer;
    }

    button:hover {
      background: #222;
    }

    #error {
      margin-top: 15px;
      color: #777;
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="message">
      <p>there is nothing here.</p>

      <p>
        perhaps you're looking in the
        <span class="clickable" onclick="showCode()">wrong place</span>.
      </p>
    </div>

    <div id="codeBox">

      <p>the door does not open for everyone.</p>

      <input
        type="text"
        id="code"
        placeholder="ENTER CODE"
        autocomplete="off"
      >

      <br>

      <button onclick="checkCode()">ENTER</button>

      <p id="error">the door remains closed.</p>

    </div>

  </div>

  <script>

    const correctCode = "Q7M-29X";

    function showCode() {
      document.getElementById("codeBox").style.display = "block";
    }

    function checkCode() {

      const input =
        document.getElementById("code").value.trim();

      if (input === correctCode) {

        window.location.href =
          "https://id.wikipedia.org/wiki/Abe_no_Seimei";

      } else {

        document.getElementById("error").style.display = "block";

      }

    }

  </script>

</body>
        </html>
